name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic gates. Runs on Node 20 and 22.
  # fail-fast is off so a failure on one Node version can't cancel the other —
  # each version's signal stays independent.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci installs exactly what package-lock.json pins — reproducible,
      # no drift, and faster than `npm install`.
      - name: Install dependencies (locked)
        run: npm ci

      # Pin python-pptx so editable-text and CJK-font checks cannot silently
      # degrade to the zip-only fallback on runner-image changes.
      - name: Install Python QA dependency
        run: python3 -m pip install --disable-pip-version-check --no-input python-pptx==1.0.2

      - name: Validate skill manifests
        run: node scripts/validate-skills.mjs

      - name: Run smoke tests
        run: node scripts/smoke-test.mjs

      - name: Run preset palette contrast QA
        run: node scripts/color-qa-presets.mjs

      - name: Build all demo PPTX decks
        run: |
          node examples/build_miku_demo.mjs
          node examples/build_editorial_demo.mjs
          node examples/build_darklaunch_demo.mjs

      # Static heuristic QA: CJK overflow, text/shape overlap, off-canvas,
      # image aspect, page-badge, layout-slot contract. P0 fails the build.
      - name: render-qa gate on all demo decks
        run: |
          node scripts/render-qa.mjs examples/slides/output/miku-demo.pptx
          node scripts/render-qa.mjs examples/slides/output/editorial-demo.pptx
          node scripts/render-qa.mjs examples/slides/output/darklaunch-demo.pptx

      # Editable-text / CJK-font / macro / theme check. python-pptx is
      # installed above, so the deep checks run instead of the zip fallback.
      - name: pptx-editable-check on demo decks
        run: |
          python3 scripts/pptx-editable-check.py examples/slides/output/miku-demo.pptx
          python3 scripts/pptx-editable-check.py examples/slides/output/editorial-demo.pptx
          python3 scripts/pptx-editable-check.py examples/slides/output/darklaunch-demo.pptx

      - name: Upload demo PPTX artifacts
        uses: actions/upload-artifact@v6
        with:
          name: demos-node-${{ matrix.node-version }}
          path: |
            examples/slides/output/miku-demo.pptx
            examples/slides/output/editorial-demo.pptx
            examples/slides/output/darklaunch-demo.pptx
          if-no-files-found: error
          retention-days: 7

  # Exercise the same installer path users invoke. A temporary Git project
  # keeps the smoke test isolated from both the workspace and global skills.
  skill-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install themed-cn-pptx through the skills CLI
        run: |
          install_root="$(mktemp -d)"
          git -C "$install_root" init -q --initial-branch=main
          cd "$install_root"
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --skill themed-cn-pptx --agent codex --copy -y
          test -f .agents/skills/themed-cn-pptx/SKILL.md

  # Heavy render verification runs once (Node 22 only), after the fast gates
  # pass. Installing LibreOffice + poppler on a single node keeps the run fast.
  render:
    needs: [test, skill-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Install LibreOffice + poppler for render verification
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice poppler-utils

      - name: Build editorial demo
        run: node examples/build_editorial_demo.mjs

      # Full render: PPTX → PDF (LibreOffice) → JPG (poppler), then heuristic
      # QA runs against the rasterized slides. Produces per-slide images for
      # human review as artifacts.
      - name: render-qa with PDF/JPG render (editorial demo)
        run: node scripts/render-qa.mjs examples/slides/output/editorial-demo.pptx --render --out qa-editorial

      - name: Upload rendered slide JPGs
        uses: actions/upload-artifact@v6
        with:
          name: qa-jpgs-editorial
          path: qa-editorial/*.jpg
          if-no-files-found: ignore
          retention-days: 7
